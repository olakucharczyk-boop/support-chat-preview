<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PubNub visuals — Support chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cherry: #CD2026;
      --navy: #001143;
      --ink: #171717;
      --ink-2: #404040;
      --ink-3: #737373;
      --canvas: #F2F2F2;
      --surface: #FFFFFF;
      --line: #E5E5E5;
      --live: #22A06B;
      --bubble: #F3D4D5;
      --wash: #F6C9CB;
      --shadow-sm: 0 4px 16px rgba(23, 23, 23, 0.08);
      --shadow-lg: 0 12px 32px rgba(23, 23, 23, 0.12);
      --radius-card: 24px;
      --font: "Nunito Sans", sans-serif;
      --loop: 8.5s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--canvas);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
    }

    .frame {
      position: relative;
      width: min(640px, 100%);
      aspect-ratio: 16 / 11;
      background: var(--surface);
      border-radius: 28px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(229, 229, 229, 0.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(229, 229, 229, 0.45) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at 52% 48%, #000 28%, transparent 72%);
      pointer-events: none;
    }

    .label {
      position: absolute;
      top: 22px;
      left: 28px;
      z-index: 4;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #b0b0b0;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .stack {
      position: relative;
      width: min(352px, 74%);
      height: 268px;
    }

    .layer {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-card);
    }

    .layer.back {
      background: #ececec;
      transform: translate(14px, 12px);
      animation: layer-drift 6.4s ease-in-out infinite;
    }

    .layer.wash {
      background: var(--wash);
      width: 44%;
      left: auto;
      right: -16%;
      top: 16%;
      bottom: 6%;
      border-radius: 22px;
      animation: wash-drift 7.2s ease-in-out infinite;
    }

    .card {
      position: relative;
      z-index: 2;
      height: 100%;
      background: var(--surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-lg);
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      animation: card-float 4.8s ease-in-out infinite;
    }

    .chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .dots {
      display: flex;
      gap: 6px;
    }
    .dots i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e0e0e0;
      display: block;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-2);
    }
    .status b {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 0 0 rgba(34, 160, 107, 0.45);
      animation: ping 1.8s ease-out infinite;
    }

    .thread {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .row.user { justify-content: flex-end; }

    .bubble {
      max-width: 230px;
      background: var(--bubble);
      border-radius: 16px;
      padding: 10px 12px;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }
    .row.user .bubble { border-bottom-right-radius: 6px; }
    .row.agent .bubble {
      border-bottom-left-radius: 6px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .meta {
      margin-top: 4px;
      font-size: 9px;
      font-weight: 600;
      color: #c0c0c0;
    }
    .row.user .meta { text-align: right; }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow-sm);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      position: relative;
    }
    .avatar::after {
      content: "";
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--live);
      border: 2px solid #fff;
    }
    .avatar svg { width: 18px; height: 13px; display: block; }

    .reply-slot {
      position: relative;
      min-height: 64px;
    }

    .typing {
      position: absolute;
      left: 36px;
      top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bubble);
      border-radius: 16px 16px 16px 6px;
      padding: 11px 14px;
      box-shadow: var(--shadow-sm);
      animation: in-typing var(--loop) ease-in-out infinite;
    }
    .typing i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c9a3a4;
      animation: dots 1.05s ease-in-out infinite;
    }
    .typing i:nth-child(2) { animation-delay: 0.14s; }
    .typing i:nth-child(3) { animation-delay: 0.28s; }

    .user-msg { animation: in-user var(--loop) ease-in-out infinite; }
    .agent-msg { animation: in-agent var(--loop) ease-in-out infinite; }

    .composer {
      margin-top: 12px;
      height: 36px;
      border-radius: 999px;
      background: #f7f7f7;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 4px;
    }
    .send {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--cherry);
      display: grid;
      place-items: center;
      margin-left: auto;
      animation: send-pulse var(--loop) ease-in-out infinite;
    }
    .send svg { width: 12px; height: 12px; fill: #fff; }

    .badge {
      position: absolute;
      right: -18px;
      bottom: 78px;
      z-index: 4;
      background: var(--cherry);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 8px 14px;
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(205, 32, 38, 0.28);
      transform: rotate(-16deg);
      animation: badge-float 3.6s ease-in-out infinite;
    }
    .badge::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: inherit;
      border: 2px solid rgba(205, 32, 38, 0.28);
      animation: ring 2.2s ease-out infinite;
      pointer-events: none;
    }

    .orbs {
      position: absolute;
      left: 16px;
      bottom: -22px;
      z-index: 5;
      display: flex;
      gap: 10px;
    }

    .orb {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #fff;
      box-shadow: var(--shadow-lg);
      display: grid;
      place-items: center;
    }
    .orb.teams { animation: orb-float 3.4s ease-in-out infinite; }
    .orb.slack {
      margin-top: 10px;
      animation: orb-float 3.8s ease-in-out 0.4s infinite;
    }
    .orb img {
      display: block;
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .spark {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cherry);
      opacity: 0.35;
    }
    .spark.a { left: 8%; top: 22%; animation: spark 5.2s ease-in-out infinite; }
    .spark.b { right: 10%; top: 18%; animation: spark 6s ease-in-out 1.1s infinite; }
    .spark.c { right: 16%; bottom: 20%; animation: spark 4.6s ease-in-out 0.6s infinite; }

    @keyframes card-float {
      0%, 100% { transform: translateY(0) rotate(-0.4deg); }
      50% { transform: translateY(-7px) rotate(0.5deg); }
    }
    @keyframes layer-drift {
      0%, 100% { transform: translate(14px, 12px); }
      50% { transform: translate(18px, 16px); }
    }
    @keyframes wash-drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(6px, -8px); }
    }
    @keyframes ping {
      0% { box-shadow: 0 0 0 0 rgba(34, 160, 107, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(34, 160, 107, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 160, 107, 0); }
    }
    @keyframes dots {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes ring {
      0% { transform: scale(0.92); opacity: 0.7; }
      100% { transform: scale(1.18); opacity: 0; }
    }
    @keyframes orb-float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-9px) rotate(5deg); }
    }
    @keyframes spark {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.2; }
      50% { transform: translateY(-10px) scale(1.35); opacity: 0.5; }
    }
    @keyframes badge-float {
      0%, 100% { transform: rotate(-16deg) translateY(0); }
      50% { transform: rotate(-12deg) translateY(-5px); }
    }
    /* User arrives immediately, conversation holds most of the loop */
    @keyframes in-user {
      0% { opacity: 0; transform: translateX(16px) scale(0.96); }
      8%, 90% { opacity: 1; transform: none; }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes in-typing {
      0%, 10% { opacity: 0; transform: translateY(6px) scale(0.94); }
      16%, 30% { opacity: 1; transform: none; }
      36%, 100% { opacity: 0; transform: translateY(-4px) scale(0.96); }
    }
    @keyframes in-agent {
      0%, 30% { opacity: 0; transform: translateX(-14px) scale(0.96); }
      38%, 90% { opacity: 1; transform: none; }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes send-pulse {
      0%, 4% { transform: scale(1); }
      7% { transform: scale(0.88); }
      12% { transform: scale(1.1); }
      18%, 100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .layer.back, .layer.wash, .card, .user-msg, .typing,
      .agent-msg, .badge, .orb, .spark, .status b, .typing i,
      .send, .badge::before {
        animation: none !important;
      }
      .user-msg, .agent-msg, .badge { opacity: 1; transform: none; }
      .typing { display: none; }
    }
  </style>
</head>
